<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>LinguaLearn</title>
  <script>
    // GitHub Pages SPA fallback:
    // Redirect to index.html preserving the path in a query param,
    // which index.html will restore via history.replaceState.
    var path = window.location.pathname;
    var base = '/lingua-learn';
    var rest = path.replace(base, '') || '/';
    var search = window.location.search;
    var hash = window.location.hash;
    var redirect = base + '/?p=' + encodeURIComponent(rest + search) + hash;
    window.location.replace(redirect);
  </script>
</head>
<body></body>
</html>
